<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Little Question 💗</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    overflow: hidden;
    font-family: Georgia, "Times New Roman", serif;
    background:
      radial-gradient(circle at 15% 20%, rgba(255,255,255,.65) 0 2px, transparent 3px),
      radial-gradient(circle at 80% 70%, rgba(255,255,255,.7) 0 3px, transparent 4px),
      linear-gradient(135deg, #f8eaf1, #eee0ec, #f9edf4);
  }

  .petal {
    position: fixed;
    font-size: 18px;
    opacity: .45;
    animation: float 8s linear infinite;
    pointer-events: none;
  }
  .p1 { left: 10%; top: 20%; animation-delay: 0s; }
  .p2 { left: 82%; top: 15%; animation-delay: 2s; }
  .p3 { left: 18%; top: 80%; animation-delay: 4s; }
  .p4 { left: 75%; top: 82%; animation-delay: 1s; }

  @keyframes float {
    0% { transform: translateY(25px) rotate(0); opacity: 0; }
    30% { opacity: .5; }
    100% { transform: translateY(-90px) rotate(180deg); opacity: 0; }
  }

  .card {
    width: min(90vw, 620px);
    min-height: 470px;
    padding: 42px 32px;
    border-radius: 28px;
    background: rgba(255,255,255,.84);
    box-shadow: 0 20px 60px rgba(100, 55, 90, .18);
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(8px);
    position: relative;
  }

  .photo {
    width: 145px;
    height: 145px;
    border-radius: 24px;
    object-fit: cover;
    background: #e8e1e7;
    box-shadow: 0 8px 25px rgba(80,40,70,.12);
    margin-bottom: 28px;
  }

  h1 {
    margin: 0;
    color: #702d45;
    font-size: clamp(28px, 6vw, 45px);
    line-height: 1.15;
  }

  .sub {
    margin: 14px 0 28px;
    color: #795a67;
    font-family: Arial, sans-serif;
    font-size: 15px;
  }

  .buttons {
    position: relative;
    width: min(390px, 90%);
    height: 75px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 30px;
  }

  button {
    border: 0;
    border-radius: 999px;
    padding: 15px 34px;
    font: 18px Georgia, serif;
    cursor: pointer;
    box-shadow: 0 7px 18px rgba(90,40,80,.16);
    transition: transform .18s ease, box-shadow .18s ease;
  }

  #yes {
    background: #d55c91;
    color: white;
  }
  #yes:hover {
    transform: scale(1.07);
    box-shadow: 0 10px 25px rgba(180,60,120,.25);
  }

  #no {
    background: #a778d2;
    color: white;
    position: relative;
  }

  .success { display: none; }
  .success h1 { margin-bottom: 12px; }
  .success p {
    color: #795a67;
    font: 17px Arial, sans-serif;
    margin: 5px 0 25px;
  }

  .heart {
    font-size: 52px;
    animation: beat 1s infinite;
  }
  @keyframes beat {
    50% { transform: scale(1.15); }
  }

  .hint {
    margin-top: 20px;
    font: 12px Arial, sans-serif;
    color: #a18191;
  }

  @media (max-width: 520px) {
    .card { min-height: 440px; padding: 30px 18px; }
    .photo { width: 120px; height: 120px; }
    .buttons { gap: 15px; }
    button { padding: 13px 27px; font-size: 16px; }
  }
</style>
</head>
<body>

<div class="petal p1">🌸</div>
<div class="petal p2">🌷</div>
<div class="petal p3">🌸</div>
<div class="petal p4">💮</div>

<main class="card" id="questionCard">
  <!-- Replace this emoji with your own photo if you want -->
  <div class="photo" style="display:grid;place-items:center;font-size:64px;">🐶</div>

  <h1>🌼 namkk nale 5 kazhinj poyalo 🌼</h1>
  <p class="sub">oru cheriya question... 🫶</p>

  <div class="buttons" id="buttonArea">
    <button id="yes">YES 🫶</button>
    <button id="no">no 🌼</button>
  </div>

  <div class="hint">P.S. Try clicking “no” 😄</div>
</main>

<main class="card success" id="successCard">
  <div class="heart">💖</div>
  <h1>WAIT... YOU ACTUALLY SAID YES?! 😭</h1>
  <p>I was so ready for you to say no 😭</p>
  <button id="okay">okay okay! →</button>
</main>

<script>
  const no = document.getElementById("no");
  const yes = document.getElementById("yes");
  const area = document.getElementById("buttonArea");
  const questionCard = document.getElementById("questionCard");
  const successCard = document.getElementById("successCard");
  const okay = document.getElementById("okay");

  // The "no" button escapes whenever the pointer gets close.
  function escapeNo(e) {
    const rect = no.getBoundingClientRect();
    const dx = e.clientX - (rect.left + rect.width / 2);
    const dy = e.clientY - (rect.top + rect.height / 2);
    const distance = Math.sqrt(dx * dx + dy * dy);

    if (distance < 120) moveNo();
  }

  function moveNo() {
    const areaRect = area.getBoundingClientRect();
    const noRect = no.getBoundingClientRect();

    const maxX = Math.max(0, areaRect.width - noRect.width);
    const maxY = Math.max(0, areaRect.height - noRect.height);

    no.style.position = "absolute";
    no.style.left = Math.random() * maxX + "px";
    no.style.top = Math.random() * maxY + "px";
  }

  document.addEventListener("pointermove", escapeNo);

  // Extra protection: if they somehow touch/click it, it escapes.
  no.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    moveNo();
  });

  no.addEventListener("mouseenter", moveNo);
  no.addEventListener("click", (e) => {
    e.preventDefault();
    moveNo();
  });

  yes.addEventListener("click", () => {
    questionCard.style.display = "none";
    successCard.style.display = "flex";
  });

  okay.addEventListener("click", () => {
    alert("Okayyy! 🫶🌼");
  });
</script>
</body>
</html>
