<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Little Question 💗</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    overflow: hidden;
    font-family: Georgia, "Times New Roman", serif;
    background: #f7f3f5;
  }

  .petal {
    position: fixed;
    font-size: 15px;
    opacity: .25;
    animation: float 10s linear infinite;
    pointer-events: none;
  }
  .p1 { left: 10%; top: 20%; animation-delay: 0s; }
  .p2 { left: 82%; top: 15%; animation-delay: 2s; }
  .p3 { left: 18%; top: 80%; animation-delay: 4s; }
  .p4 { left: 75%; top: 82%; animation-delay: 1s; }

  @keyframes float {
    0% { transform: translateY(25px) rotate(0); opacity: 0; }
    30% { opacity: .5; }
    100% { transform: translateY(-90px) rotate(180deg); opacity: 0; }
  }

  .card {
    width: min(90vw, 620px);
    min-height: 470px;
    padding: 42px 32px;
    border-radius: 28px;
    background: #ffffff;
    box-shadow: 0 8px 30px rgba(100, 55, 90, .10);
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(8px);
    position: relative;
  }

  .photo {
    width: 145px;
    height: 145px;
    border-radius: 24px;
    object-fit: cover;
    background: #e8e1e7;
    box-shadow: 0 8px 25px rgba(80,40,70,.12);
    margin-bottom: 28px;
  }

  h1 {
    margin: 0;
    color: #4f3d48;
    font-size: clamp(25px, 5vw, 36px);
    line-height: 1.15;
  }

  .sub {
    margin: 12px 0 24px;
    color: #746771;
    font-family: Arial, sans-serif;
    font-size: 15px;
  }

  .buttons {
    position: relative;
    width: min(390px, 90%);
    height: 75px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 30px;
  }

  button {
    border: 0;
    border-radius: 999px;
    padding: 15px 34px;
    font: 18px Georgia, serif;
    cursor: pointer;
    box-shadow: 0 7px 18px rgba(90,40,80,.16);
    transition: transform .18s ease, box-shadow .18s ease;
  }

  #yes {
    background: #d98bab;
    color: white;
  }
  #yes:hover {
    transform: scale(1.07);
    box-shadow: 0 10px 25px rgba(180,60,120,.25);
  }

  #no {
    background: #b8a1c9;
    color: white;
    position: relative;
  }

  .success { display: none; }
  .success h1 { margin-bottom: 12px; }
  .success p {
    color: #795a67;
    font: 17px Arial, sans-serif;
    margin: 5px 0 25px;
  }

  .heart {
    font-size: 38px;
  }

  .hint {
    margin-top: 18px;
    font: 12px Arial, sans-serif;
    color: #a0929a;
  }

  @media (max-width: 520px) {
    .card { min-height: 440px; padding: 30px 18px; }
    .photo { width: 120px; height: 120px; }
    .buttons { gap: 15px; }
    button { padding: 13px 27px; font-size: 16px; }
  }
</style>
</head>
<body>

<div class="petal p1">🌸</div>
<div class="petal p2">🌷</div>
<div class="petal p3">🌸</div>
<div class="petal p4">💮</div>

<main class="card" id="questionCard">
  <!-- Replace this emoji with your own photo if you want -->
  <div class="photo" style="display:grid;place-items:center;font-size:58px;">🐶</div>

  <h1>namkk nale 5 kazhinj poyalo? 🌼</h1>
  <p class="sub">oru cheriya plan alle 😊</p>

  <div class="buttons" id="buttonArea">
    <button id="yes">YES 👍</button>
    <button id="no">no 🙂</button>
  </div>

  <div class="hint">choose one 😄</div>
</main>

<main class="card success" id="successCard">
  <div class="heart">😊</div>
  <h1>Okay, set then! 😄</h1>
  <p>Namukk nale 5 kazhinj poyekkam.</p>
  <button id="okay">okay 👍</button>
</main>

<script>
  const no = document.getElementById("no");
  const yes = document.getElementById("yes");
  const area = document.getElementById("buttonArea");
  const questionCard = document.getElementById("questionCard");
  const successCard = document.getElementById("successCard");
  const okay = document.getElementById("okay");

  // The "NO" button escapes far away from the pointer.
  function escapeNo(e) {
    const rect = no.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;
    const distance = Math.hypot(e.clientX - centerX, e.clientY - centerY);

    if (distance < 180) moveNo(e.clientX, e.clientY);
  }

  function moveNo(pointerX = window.innerWidth / 2, pointerY = window.innerHeight / 2) {
    const areaRect = area.getBoundingClientRect();
    const noRect = no.getBoundingClientRect();

    no.style.position = "absolute";

    // Keep the NO button well away from YES and from the pointer.
    const yesRect = yes.getBoundingClientRect();
    const minDistanceFromYes = 170;
    const minDistanceFromPointer = 150;

    let best = null;
    let bestScore = -Infinity;

    for (let i = 0; i < 80; i++) {
      const x = Math.random() * Math.max(1, areaRect.width - noRect.width);
      const y = Math.random() * Math.max(1, areaRect.height - noRect.height);

      const candidateX = areaRect.left + x + noRect.width / 2;
      const candidateY = areaRect.top + y + noRect.height / 2;

      const distPointer = Math.hypot(candidateX - pointerX, candidateY - pointerY);
      const yesCenterX = yesRect.left + yesRect.width / 2;
      const yesCenterY = yesRect.top + yesRect.height / 2;
      const distYes = Math.hypot(candidateX - yesCenterX, candidateY - yesCenterY);

      // Prefer positions far from both the pointer and YES.
      const score = Math.min(distPointer, distYes);

      if (score > bestScore) {
        bestScore = score;
        best = { x, y };
      }

      if (distPointer >= minDistanceFromPointer &&
          distYes >= minDistanceFromYes) {
        best = { x, y };
        break;
      }
    }

    if (best) {
      no.style.left = best.x + "px";
      no.style.top = best.y + "px";
    }
  }

  document.addEventListener("pointermove", escapeNo);

  // If they somehow reach/click NO, immediately move it again.
  no.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    moveNo(e.clientX, e.clientY);
  });

  no.addEventListener("mouseenter", (e) => {
    moveNo(e.clientX, e.clientY);
  });

  no.addEventListener("click", (e) => {
    e.preventDefault();
    moveNo(e.clientX, e.clientY);
  });

  yes.addEventListener("click", () => {
    questionCard.style.display = "none";
    successCard.style.display = "flex";
  });

  okay.addEventListener("click", () => {
    alert("Okay 👍");
  });
</script>
</body>
</html>
